<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1280" viewBox="0 0 1600 1280" role="img" aria-labelledby="title desc">
<title id="title">envctl 전체 구조: 도구와 금고, 세 가지 사용 환경</title><desc id="desc">env-store는 CLI와 대시보드 코드를 제공합니다. env-store-vault는 age 암호문과 수신자 명단, 메타데이터를 저장합니다. 개발자는 로컬 캐시에서 복호화해 프로세스에 주입하고 서버는 render로 환경변수 파일을 생성합니다. CI는 빌드 수신자로 지정된 값만 복호화합니다. 대시보드는 SSH로 서버 반영을 요청하고 서버 notify는 Slack 만료 알림을 발송합니다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker><marker id="back" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker><marker id="purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#805ad5"/></marker></defs>
<rect width="1600" height="1280" fill="#f7f9fc"/><g font-family="-apple-system, BlinkMacSystemFont, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
<text x="80" y="70" font-size="18" fill="#64748b" font-weight="700">ENVCTL ARCHITECTURE</text>
<text x="80" y="120" font-size="36" fill="#0f172a" font-weight="700">환경변수의 원본은 금고에, 사용과 반영은 각 환경에서</text>
<rect x="80" y="158" width="1440" height="124" rx="20" fill="#fff" stroke="#cbd5e1"/>
<text x="110" y="202" font-size="29" fill="#0f172a" font-weight="700">env-store</text>
<text x="110" y="245" font-size="20" fill="#64748b" font-weight="400">도구 코드 저장소</text>
<text x="425" y="204" font-size="25" fill="#0f172a" font-weight="600">envctl CLI + 로컬 대시보드 + GitAgeAdapter</text>
<text x="425" y="244" font-size="20" fill="#334155" font-weight="400">개발자·서버에 설치  /  Git과 age로 저장·동기화·암복호화  /  CI는 워크플로우에서 age 사용</text>
<rect x="420" y="330" width="760" height="238" rx="20" fill="#eff6ff" stroke="#9bbcea"/>
<text x="452" y="373" font-size="30" fill="#1e40af" font-weight="700">env-store-vault</text>
<text x="452" y="410" font-size="22" fill="#334155" font-weight="400">비공개 Git 저장소 · 환경변수의 원본</text>
<text x="452" y="454" font-size="24" fill="#0f172a" font-weight="600">프로젝트 / dev·prod / KEY.age</text>
<text x="452" y="491" font-size="20" fill="#334155" font-weight="400">recipients/   dev · prod · build-ci 공개키 명단</text>
<text x="452" y="528" font-size="20" fill="#334155" font-weight="400">meta.json   만료일·담당자     projects.json   렌더·배포 설정</text>
<text x="84" y="375" font-size="19" fill="#1e40af" font-weight="600">저장: 값은 암호문</text>
<text x="84" y="411" font-size="19" fill="#334155" font-weight="400">키 이름·메타는 평문</text>
<text x="1216" y="375" font-size="19" fill="#334155" font-weight="600">개인키는 금고에</text>
<text x="1216" y="407" font-size="19" fill="#334155" font-weight="400">저장하지 않습니다</text>
<path d="M 535 568 V 613 H 310 V 680" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)" marker-start="url(#back)"/>
<path d="M 800 568 V 680" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M 1065 568 V 613 H 1290 V 680" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="104" y="624" width="345" height="38" rx="5" fill="#f7f9fc" stroke="#f7f9fc"/>
<text x="117" y="651" font-size="20" fill="#334155" font-weight="400">Git pull / 변경 시 commit·push</text>
<rect x="669" y="624" width="262" height="38" rx="5" fill="#f7f9fc" stroke="#f7f9fc"/>
<text x="685" y="651" font-size="19" fill="#334155" font-weight="400">Git pull · 서버 키로 복호화</text>
<rect x="1131" y="624" width="305" height="38" rx="5" fill="#f7f9fc" stroke="#f7f9fc"/>
<text x="1147" y="651" font-size="19" fill="#334155" font-weight="400">Checkout · CI 키로 복호화</text>
<rect x="80" y="686" width="460" height="342" rx="20" fill="#fff" stroke="#dbe3ee"/>
<text x="108" y="733" font-size="29" fill="#0f172a" font-weight="700">개발자 로컬</text>
<text x="108" y="772" font-size="20" fill="#64748b" font-weight="400">개인 age 키 + vault 암호문 캐시</text>
<rect x="570" y="686" width="460" height="342" rx="20" fill="#fff" stroke="#dbe3ee"/>
<text x="598" y="733" font-size="29" fill="#0f172a" font-weight="700">운영 서버</text>
<text x="598" y="772" font-size="20" fill="#64748b" font-weight="400">서버 age 키 + vault 암호문 캐시</text>
<rect x="1060" y="686" width="460" height="342" rx="20" fill="#fff" stroke="#dbe3ee"/>
<text x="1088" y="733" font-size="29" fill="#0f172a" font-weight="700">GitHub Actions</text>
<text x="1088" y="772" font-size="20" fill="#64748b" font-weight="400">vault 읽기 권한 + CI 전용 age 키</text>
<text x="108" y="821" font-size="22" fill="#0f172a" font-weight="600">exec → 복호화 → 환경변수 주입</text>
<text x="108" y="856" font-size="20" fill="#334155" font-weight="400">개발 프로세스 실행 · .env 생성 없음</text>
<text x="108" y="906" font-size="22" fill="#0f172a" font-weight="600">dashboard → 로컬 조회·수정</text>
<text x="108" y="941" font-size="20" fill="#334155" font-weight="400">127.0.0.1 + 실행별 API 토큰</text>
<text x="108" y="988" font-size="19" fill="#1e40af" font-weight="400">set / keys → 암호화·재암호화 후 push</text>
<text x="598" y="821" font-size="22" fill="#0f172a" font-weight="600">render → 복호화 → .env 생성</text>
<text x="598" y="856" font-size="20" fill="#334155" font-weight="400">원자적 교체 · 백업 · PM2 reload</text>
<text x="598" y="906" font-size="22" fill="#0f172a" font-weight="600">notify → 메타데이터 만료 점검</text>
<text x="598" y="941" font-size="20" fill="#334155" font-weight="400">스케줄러 + 웹훅 → Slack 알림</text>
<text x="598" y="988" font-size="19" fill="#1e40af" font-weight="400">금고 저장과 서버 반영은 별도 단계</text>
<text x="1088" y="821" font-size="21" fill="#0f172a" font-weight="600">빌드 수신자로 지정된 값만 복호화</text>
<text x="1088" y="856" font-size="20" fill="#334155" font-weight="400">.env.production 생성 → 빌드</text>
<text x="1088" y="906" font-size="22" fill="#0f172a" font-weight="600">CI가 수신자가 아닌 런타임 값</text>
<text x="1088" y="941" font-size="20" fill="#334155" font-weight="400">CI 개인키로 복호화할 수 없음</text>
<text x="1088" y="988" font-size="19" fill="#1e40af" font-weight="400">NEXT_PUBLIC 변경은 재빌드 필요</text>
<path d="M 310 1028 V 1088 H 800 V 1028" fill="none" stroke="#805ad5" stroke-width="3" marker-end="url(#purple)" stroke-dasharray="8 7"/>
<rect x="372" y="1069" width="365" height="40" rx="5" fill="#f7f9fc" stroke="#f7f9fc"/>
<text x="389" y="1097" font-size="18" fill="#805ad5" font-weight="600">대시보드 [서버 반영] → SSH → render</text>
<text x="1067" y="1082" font-size="19" fill="#805ad5" font-weight="600">deploy --run → CD 실행 요청</text>
<text x="1067" y="1114" font-size="18" fill="#64748b" font-weight="400">값 전달 대신 워크플로우를 트리거</text>
<path d="M 80 1147 H 1520" stroke="#dbe3ee"/>
<text x="80" y="1185" font-size="20" fill="#475569" font-weight="600">구현 기준: git + age PoC  ·  SSM 전환은 향후 계획</text>
<text x="80" y="1224" font-size="20" fill="#64748b" font-weight="400">원격 동기화 실패 시 로컬 캐시 사용  /  exec는 재실행, 서버는 render, 빌드 변수는 재빌드 시 반영</text>
</g></svg>